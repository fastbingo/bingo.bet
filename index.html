<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>75-Ball Bingo Classic</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

  <!-- External App Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-wrapper">
    <!-- Top Bar Navigation & Profile -->
    <header class="app-header">
      <div class="user-chip">
        <img id="user-avatar" src="https://via.placeholder.com/40/1f293d/3b82f6?text=B" alt="User Avatar">
        <div class="user-meta">
          <span id="user-name" class="user-name">Player</span>
          <span class="vip-badge">VIP STREAK</span>
        </div>
      </div>

      <div class="balance-badge">
        <svg class="coin-icon" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10" fill="#f59e0b"/>
          <path d="M12 6v12M9 9.5h6M9 14.5h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="user-balance">5,000</span>
      </div>
    </header>

    <!-- Caller Arena Header Section -->
    <section class="caller-arena">
      <div class="status-ribbon">
        <span id="game-status-text">LIVE SESSION</span>
        <span id="called-count-badge">0 / 20 BALLS</span>
      </div>

      <div class="caller-display">
        <!-- Giant Glowing Main Ball Display -->
        <div class="ball-stage">
          <div class="giant-ball B" id="current-ball-el">
            <span class="letter" id="current-letter">--</span>
            <span class="number" id="current-number">--</span>
          </div>
        </div>

        <!-- History Strip -->
        <div class="history-panel">
          <span class="history-label">LAST CALLS</span>
          <div class="recent-balls-strip" id="recent-balls-list">
            <span class="empty-msg">Waiting for first draw...</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Phase 1: Purchase Deck -->
    <section class="purchase-panel" id="purchase-panel">
      <div class="panel-card">
        <h2 class="panel-title">SELECT TICKETS</h2>
        <p class="panel-subtitle">Standard 75-Ball Pattern Bingo • 500 PTS / Ticket</p>

        <div class="ticket-counter">
          <button type="button" class="count-btn" onclick="changeTicketCount(-1)">−</button>
          <div class="count-display">
            <span id="ticket-count-display">1</span>
            <small>TICKET(S)</small>
          </div>
          <button type="button" class="count-btn" onclick="changeTicketCount(1)">+</button>
        </div>

        <div class="options-row">
          <label class="auto-daub-toggle">
            <input type="checkbox" id="auto-daub-check" checked onchange="toggleAutoDaub(this.checked)">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Auto-Daub Assistance</span>
          </label>
        </div>

        <div class="checkout-footer">
          <div class="total-cost">
            <span>TOTAL COST</span>
            <strong id="total-cost-display">500 PTS</strong>
          </div>
          <button type="button" class="btn-primary" id="buy-btn" onclick="confirmPurchase()">
            BUY & PLAY NOW
          </button>
        </div>
      </div>
    </section>

    <!-- Phase 2: Interactive Bingo Cards Area -->
    <section class="tickets-container hidden" id="tickets-container">
      <!-- 5x5 Cards dynamically injected here -->
    </section>

    <!-- Phase 3: Action Deck (Fixed Bottom Bar) -->
    <div class="action-bar hidden" id="action-bar">
      <button type="button" class="bingo-claim-btn" id="bingo-btn" onclick="claimBingo()">
        <span class="glow"></span>
        <span class="text">BINGO!</span>
      </button>
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- External Script -->
  <script src="app.js"></script>
</body>
</html>
