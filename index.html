<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>75-Ball Bingo - Telegram Mini App</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header: User Profile & Match Status -->
    <header class="app-header">
      <div class="user-profile">
        <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar">
        <div class="user-info">
          <span id="user-name">Player</span>
          <span id="user-balance">Balance: 5,000 PTS</span>
        </div>
      </div>
      <div class="game-status">
        <span class="badge" id="called-count">Balls: 0 / 20</span>
      </div>
    </header>

    <!-- Ball Caller Display Area -->
    <section class="ball-caller-section">
      <div class="last-ball-container">
        <div class="ball-callout" id="current-ball">--</div>
        <div class="ball-label" id="current-letter">WAITING FOR GAME</div>
      </div>
      <div class="recent-balls" id="recent-balls-list">
        <!-- Up to 5 recently drawn mini-balls populate here dynamically -->
      </div>
    </section>

    <!-- Purchase Panel: Select Number of 500-Point Tickets -->
    <section class="purchase-panel" id="purchase-panel">
      <h2>Select Your Tickets</h2>
      <p class="subtitle">Price: <strong>500 PTS</strong> per ticket (Max 4 tickets)</p>
      
      <div class="ticket-selector">
        <button type="button" class="selector-btn" onclick="changeTicketCount(-1)">-</button>
        <span id="ticket-count-display">1</span>
        <button type="button" class="selector-btn" onclick="changeTicketCount(1)">+</button>
      </div>
      
      <div class="cost-summary">
        Total Cost: <span id="total-cost-display">500</span> PTS
      </div>

      <button type="button" class="primary-btn" id="buy-btn" onclick="confirmPurchase()">
        Buy Tickets & Play
      </button>
    </section>

    <!-- Interactive Playing Cards Container -->
    <section class="tickets-container hidden" id="tickets-container">
      <!-- 5x5 Bingo Cards will be dynamically injected here by app.js -->
    </section>

    <!-- Fixed Action Bar: Claim Victory -->
    <div class="action-bar hidden" id="action-bar">
      <button type="button" class="bingo-claim-btn" id="bingo-btn" onclick="claimBingo()">
        BINGO!
      </button>
    </div>
  </div>

  <!-- Confetti Canvas overlay for winning claims -->
  <canvas id="confetti-canvas"></canvas>

  <!-- External Application Logic -->
  <script src="app.js"></script>
</body>
</html>
