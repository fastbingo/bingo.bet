<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>75-Ball Bingo Admin Console</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
    button { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .danger { background: #ef4444; }
    .matrix { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-top: 20px; }
    .cell { background: #334155; padding: 8px; text-align: center; border-radius: 4px; font-size: 12px; }
    .cell.called { background: #10b981; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bingo Admin Control</h1>
    <p>Status: <span id="status">Idle</span> | Called: <span id="count">0</span> / 20</p>
    <br>
    <button onclick="startAutoDraw()">Start Automatic 20-Ball Game</button>
    <button class="danger" onclick="resetGame()">Reset Game</button>

    <div class="matrix" id="admin-matrix"></div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
