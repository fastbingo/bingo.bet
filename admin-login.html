<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
admin.css
</head>
<body>

<div class="login-box">

<h1>FAST BINGO ADMIN</h1>

<input
id="password"
type="password"
placeholder="Admin Password">

<button onclick="login()">
Login
</button>

</div>

<script>

const API =
"https://YOUR-WORKER.workers.dev";

async function login(){

  const password =
    document.getElementById(
      "password"
    ).value;

  const res =
    await fetch(
      API + "/api/admin/login",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/json"
        },
        body:JSON.stringify({
          password
        })
      }
    );

  if(res.ok){

    localStorage.setItem(
      "adminToken",
      password
    );

    location.href =
      "admin.html";

  }else{

    alert("Invalid password");

  }

}
</script>

</body>
</html>
