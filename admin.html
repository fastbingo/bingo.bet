<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST BINGO ADMIN</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

    <header class="topbar">

        <div>
            <h1>🎰 FAST BINGO ADMIN</h1>
            <p class="subtitle">
                Deposit & Withdrawal Management Panel
            </p>
        </div>

        <div class="actions-top">

            <button
                class="refresh-btn"
                onclick="loadPending()">

                🔄 Refresh

            </button>

            <button
                class="logout-btn"
                onclick="logout()">

                🚪 Logout

            </button>

        </div>

    </header>

    <section class="stats">

        <div class="card">

            <div class="icon">💰</div>

            <h3>Pending Deposits</h3>

            <span id="deposit-count">0</span>

        </div>

        <div class="card">

            <div class="icon">💸</div>

            <h3>Pending Withdrawals</h3>

            <span id="withdraw-count">0</span>

        </div>

    </section>

    <section class="transactions-section">

        <h2>Transactions</h2>

        <div id="transactions">

            <div class="loading">
                Loading transactions...
            </div>

        </div>

    </section>

</div>

admin.jsscript>

</body>
</html>
