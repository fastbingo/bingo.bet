<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FAST BINGO ADMIN</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="topbar">

        <div class="brand">

            <h1>🎰 FAST BINGO ADMIN</h1>

            <span class="subtitle">
                Deposit & Withdrawal Management
            </span>

        </div>

        <div class="top-actions">

            <button
                class="refresh-btn"
                onclick="loadPending()">

                🔄 Refresh

            </button>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>

    <!-- DASHBOARD STATS -->

    <div class="stats">

        <div class="card deposit-card">

            <div class="card-icon">

                💰

            </div>

            <div class="card-content">

                <h3>
                    Pending Deposits
                </h3>

                <span id="deposit-count">
                    0
                </span>

            </div>

        </div>

        <div class="card withdraw-card">

            <div class="card-icon">

                💸

            </div>

            <div class="card-content">

                <h3>
                    Pending Withdrawals
                </h3>

                <span id="withdraw-count">
                    0
                </span>

            </div>

        </div>

    </div>

    <!-- TRANSACTIONS -->

    <div class="section-header">

        <h2>
            Pending Transactions
        </h2>

    </div>

    <div id="transactions">

        <div class="loading">

            Loading transactions...

        </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        FAST BINGO ADMIN PANEL

    </div>

</div>

admin.jsscript>

</body>
</html>
