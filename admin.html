<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telebirr Bingo - Admin Control Panel</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --text: #f0f6fc;
      --text-muted: #8b949e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #30363d;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #fff;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    button.btn-green { background: var(--green); color: #000; border: none; }
    button.btn-red { background: var(--red); color: #fff; border: none; }

    .txn-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .txn-table th, .txn-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #30363d;
    }

    .txn-table th { background: #21262d; color: var(--text-muted); }

    .badge-deposit { color: var(--green); font-weight: bold; }
    .badge-withdraw { color: var(--accent); font-weight: bold; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>🔑 Telebirr Bingo Admin Dashboard</h2>
    <span id="status-tag" style="color:var(--text-muted);">Disconnected</span>
  </div>

  <!-- AUTHENTICATION -->
  <div id="auth-panel" class="auth-card">
    <p>Enter Admin Key to manage requests:</p>
    <input type="password" id="admin-key-input" placeholder="Admin Secret Key" style="width: 250px;">
    <button onclick="loginAdmin()">Access Dashboard</button>
  </div>

  <!-- MAIN ADMIN PANEL -->
  <div id="admin-panel" class="hidden">
    <h3>Pending Financial Requests</h3>
    <button onclick="fetchPendingRequests()">🔄 Refresh List</button>

    <table class="txn-table">
      <thead>
        <tr>
          <th>TXN ID</th>
          <th>User</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Telebirr / TXN Info</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="txn-list">
        <tr><td colspan="6">Loading requests...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const WORKER_URL = "https://bingobet.ketiolcj.workers.dev"; // Your Cloudflare Worker URL
  let adminKey = "";

  function loginAdmin() {
    adminKey = document.getElementById("admin-key-input").value.trim();
    if (!adminKey) return alert("Please enter the Admin Key!");

    fetchPendingRequests();
  }

  async function fetchPendingRequests() {
    try {
      const res = await fetch(`${WORKER_URL}/api/admin/pending`, {
        headers: { "x-admin-key": adminKey }
      });

      if (!res.ok) throw new Error("Unauthorized or server error");

      const data = await res.json();
      document.getElementById("auth-panel").classList.add("hidden");
      document.getElementById("admin-panel").classList.remove("hidden");
      document.getElementById("status-tag").innerText = "Connected";
      document.getElementById("status-tag").style.color = "var(--green)";

      renderTable(data.pending);
    } catch (err) {
      alert("Access Denied: Invalid Admin Key or Connection Error.");
    }
  }

  function renderTable(requests) {
    const tbody = document.getElementById("txn-list");
    tbody.innerHTML = "";

    if (!requests || requests.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No pending requests.</td></tr>';
      return;
    }

    requests.forEach(req => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${req.id}</strong></td>
        <td>${req.first_name} <br><small style="color:var(--text-muted);">ID: ${req.user_id}</small></td>
        <td class="${req.type === 'Deposit' ? 'badge-deposit' : 'badge-withdraw'}">${req.type}</td>
        <td><strong>${req.amount} ETB</strong></td>
        <td><code>${req.details}</code></td>
        <td>
          <button class="btn-green" onclick="processAction('${req.id}', 'Approve')">Approve</button>
          <button class="btn-red" onclick="processAction('${req.id}', 'Reject')">Reject</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function processAction(txnId, action) {
    if (!confirm(`Are you sure you want to ${action} transaction ${txnId}?`)) return;

    try {
      const res = await fetch(`${WORKER_URL}/api/admin/action`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-key": adminKey
        },
        body: JSON.stringify({ txnId, action })
      });

      const result = await res.json();
      if (result.success) {
        alert(`Transaction ${action}d successfully!`);
        fetchPendingRequests();
      } else {
        alert(`Error: ${result.error}`);
      }
    } catch (e) {
      alert("Failed to execute request.");
    }
  }
</script>

</body>
</html>
